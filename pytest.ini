[tool:pytest]
# GraphRAG 项目 pytest 配置
# ===============================

# 测试发现配置
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# 最小版本要求
minversion = 6.0

# 添加选项
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --maxfail=5
    --durations=10
    --color=yes
    --disable-warnings

# 标记定义
markers =
    unit: 单元测试标记
    integration: 集成测试标记
    database: 数据库相关测试
    api: API接口测试
    performance: 性能测试标记
    slow: 慢速测试标记（运行时间 > 5秒）
    smoke: 冒烟测试标记
    regression: 回归测试标记
    security: 安全测试标记
    mock: 使用mock的测试
    external: 需要外部服务的测试
    neo4j: Neo4j数据库测试
    postgres: PostgreSQL数据库测试
    embedding: 向量嵌入相关测试
    nlp: 自然语言处理测试
    graph: 图数据库操作测试
    file_processing: 文件处理测试
    concurrent: 并发测试
    memory_intensive: 内存密集型测试

# 过滤警告
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*unclosed.*:ResourceWarning

# 测试超时设置（秒）
timeout = 300
timeout_method = thread

# 覆盖率配置
# 注意：这些配置也可以在 .coveragerc 文件中设置
# --cov=app
# --cov-report=html
# --cov-report=term-missing
# --cov-fail-under=80

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d %(funcName)s(): %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# 异步测试支持
asyncio_mode = auto

# 测试数据目录
# 可以在测试中使用 pytest.test_data_dir 访问
test_data_dir = tests/fixtures

# JUnit XML 报告（用于CI/CD）
# junit_family = xunit2
# junit_logging = all

# 并行测试配置（需要 pytest-xdist）
# -n auto  # 自动检测CPU核心数
# --dist worksteal  # 工作窃取模式

# 重试配置（需要 pytest-rerunfailures）
# --reruns 2  # 失败重试2次
# --reruns-delay 1  # 重试间隔1秒

# HTML报告配置（需要 pytest-html）
# --html=reports/report.html
# --self-contained-html

# 基准测试配置（需要 pytest-benchmark）
# --benchmark-only
# --benchmark-sort=mean
# --benchmark-json=reports/benchmark.json